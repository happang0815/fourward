<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>product</title>
    <style>
      .container {
        margin: 30px;
      }
      .search-container {
        display: flex;
        gap: 20px;
        margin: 20px;
        justify-content: center;
      }
      .search-container input {
        width: 300px;
        border: 2px solid #9dd6ff;
        border-radius: 30px;
        padding: 10px 20px;
      }
      .search-container select {
        border: 2px solid #9dd6ff;
        border-radius: 30px;
        padding: 10px 20px;
      }
      .spinner {
        display: none;
        width: 48px;
        height: 48px;
        border: 5px solid lightgray;
        border-top-color: darkblue;
        border-radius: 50%;
        animation-name: spinner;
        animation-duration: 1.5s;
        animation-iteration-count: infinite; /* 실행 횟수 */
        animation-timing-function: linear;
      }

      @keyframes spinner {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      .main-container h2 {
        margin-bottom: 20px;
      }
      #product-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 20px;
        align-items: start;
      }
      #product-container div {
        display: flex;
        position: relative;
        flex-direction: column;
        background-color: white;
        border-radius: 10px;
        padding: 10px 20px;
        transition: transform 0.3s ease;
        box-shadow: 0 4px 6px rgb(0 0 0/0.1);
        aspect-ratio: 1/1;
      }
      #product-container div:hover {
        cursor: pointer;
        transform: scale(1.15);
      }
      #product-container h3 {
        padding-bottom: 10px;
        margin: 25px 0 10px 0;
        border-bottom: 1px solid lightgray;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .product-price {
        color: #e94c4c;
        font-size: 18px;
        font-weight: bold;
      }
      .badge {
        position: absolute;
        top: -12px;
        left: -12px;
        background-color: #ff4757;
        color: white;
        border-radius: 10px;
        padding: 10px;
        font-size: 13px;
        font-weight: bold;
        z-index: 10;
        box-shadow: 2px 2px 6px rgb(0 0 0/0.2);
      }
      .product-desc {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        color: #666;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="logo">
        <h1><a href="index.html">쇼핑몰</a></h1>
      </div>
      <div>
        <nav class="header-nev">
          <ul class="header-list">
            <li><a href="mypage.html">내정보</a></li>
            <li><a href="order.html">주문</a></li>
            <li><a href="product.html">상품</a></li>
            <li><a href="review.html">리뷰</a></li>
            <li><a href="login.html" id="auth-link">로그인</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <div class="container">
      <div class="search-container">
        <input type="text" id="search-input" placeholder="상품명" />
        <button id="search-button">검색</button>
      </div>
      <div class="main-container">
        <h2>상품 목록</h2>
        <div id="product-container"></div>
        <div id="loading-spinner" class="spinner"></div>
      </div>
    </div>
    <footer>
      <p>&copy; 2026 내 쇼핑몰.</p>
    </footer>
    <script src="/fourward/src/js/login.js"></script>
    <script>
      // 로딩중...
      const showSpinner = () => {
        const startSpinner = document.getElementById("loading-spinner");
        startSpinner.style.display = "inline-block";
      };
      // 로딩 완료
      const hideSpinner = () => {
        const stopSpinner = document.getElementById("loading-spinner");
        stopSpinner.style.display = "none";
      };

      // 화면 실행됐을 때 상품 목록 전체 보여주기
      onload = async () => {
        // 스피너 켜기
        showSpinner();
        const products = await fetch(
          "http://teacherdev09.kro.kr:10002/endpoint/api/products",
        );
        if (!products.ok)
          throw new Error("상품정보를 가져오는데 실패했습니다.");
        const data = await products.json();
        console.log(data);
        const product = document.getElementById("product-container");
        product.replaceChildren();

        // 카테고리 불러오기
        const categorySet = new Set();
        const $select = document.createElement("select");
        const $optionOri = document.createElement("option");
        $optionOri.value = "";
        $optionOri.textContent = "선택";
        $select.appendChild($optionOri);

        // 데이터 불러와서 div만들어서 넣기
        data.data.content.forEach((item) => {
          categorySet.add(item.category);

          const $div = document.createElement("div");
          const $h3 = document.createElement("h3");
          const $p = document.createElement("p");
          const $p2 = document.createElement("p");
          const $p3 = document.createElement("p");

          $h3.textContent = item.name;
          $p.textContent = `${item.price}원`;
          $p.className = "product-price";
          $p2.textContent = item.category;
          $p3.textContent = item.description;
          $p3.className = "product-desc";

          if (item.stockQuantity < 40) {
            const $badge = document.createElement("span");
            $badge.textContent = "품절임박";
            $badge.className = "badge";
            $div.appendChild($badge);
          }

          $div.appendChild($h3);
          $div.appendChild($p);
          $div.appendChild($p2);
          $div.appendChild($p3);
          product.appendChild($div);

          $div.addEventListener("click", () => {
            window.location.href = `detail.html?id=${item.id}`;
          });
        });

        categorySet.forEach((cat) => {
          const $option = document.createElement("option");
          $option.value = cat;
          $option.textContent = cat;
          $select.appendChild($option);
        });
        const searchContainer = document.querySelector(".search-container");
        searchContainer.insertBefore($select, searchBtn);

        // 스피너 끄기
        hideSpinner();
      };

      // 검색 기능
      const searchBtn = document.getElementById("search-button");
      searchBtn.addEventListener("click", async () => {
        const product = document.getElementById("product-container");
        product.replaceChildren();
        showSpinner();
        const search = document.getElementById("search-input").value;
        const category = document.querySelector(
          ".search-container select",
        ).value;

        // 사용자가 입력을 아무것도 안했을 시 처리.
        if (search === "" && category === "") {
          alert("검색어나 카테고리를 입력해 주세요!");
        }

        const products = await fetch(
          `http://teacherdev09.kro.kr:10002/endpoint/api/products?keyword=${search}&category=${category}`,
        );
        if (!products.ok)
          throw new Error("상품정보를 가져오는데 실패했습니다.");
        const data = await products.json();

        if (data.success === false) {
          product.textContent = data.message;
        } else {
          if (data.data.content.length === 0) {
            product.textContent = "해당하는 상품이 없습니다.";
          } else {
            data.data.content.forEach((item) => {
              const $div = document.createElement("div");
              const $h3 = document.createElement("h3");
              const $p = document.createElement("p");
              const $p2 = document.createElement("p");
              const $p3 = document.createElement("p");
              $h3.textContent = item.name;
              $p.textContent = `${item.price}원`;
              $p2.textContent = item.category;
              $p3.textContent = item.description;
              $p3.className = "product-desc";

              if (item.stockQuantity < 40) {
                const $badge = document.createElement("span");
                $badge.textContent = "품절임박";
                $badge.className = "badge";
                $div.appendChild($badge);
              }

              $div.appendChild($h3);
              $div.appendChild($p);
              $div.appendChild($p2);
              $div.appendChild($p3);
              product.appendChild($div);
              $div.addEventListener("click", () => {
                window.location.href = `detail.html?id=${item.id}`;
              });
            });
          }
        }

        hideSpinner();
      });
    </script>
  </body>
</html>
