<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>주문하기</title>
    <link rel="stylesheet" href="/fourward/src/css/style.css" />
  </head>
  <body>
    <header class="header">
      <div class="logo">
        <h1><a href="index.html">쇼핑몰</a></h1>
      </div>
      <div>
        <nav class="header-nev">
          <ul class="header-list">
            <li><a href="mypage.html">내정보</a></li>
            <li><a href="order.html">주문</a></li>
            <li><a href="product.html">상품</a></li>
            <li><a href="review.html">리뷰</a></li>
            <li><a href="login.html" id="auth-link">로그인</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="main-page">
      <h2>주문하기</h2>

      <li>
        주문
        <div id="loginRequiredMsg"></div>
        <div>
          <label>상품 선택</label>
          <select id="productSelect"></select>

          <label>가격</label>
          <span id="selectedPrice"></span>

          <label>카테고리</label>
          <span id="selectedCategory"></span>

          <label>재고</label>
          <span id="selectedStock"></span>

          <label>수량</label>
          <input type="number" id="quantity" value="1" min="1" />

          <div>
            <span>총 금액 : </span>
            <span id="totalPrice"></span>
          </div>

          <button id="orderBtn">주문하기</button>
        </div>
        <div id="orderMsg"></div>
      </li>

      <li>
        주문 확인
        <div id="orderConfirmArea">
          <p>주문번호 : <span id="confirmOrderId"></span></p>
          <p>주문상품 : <span id="confirmProductName"></span></p>
          <p>수량 : <span id="confirmQuantity"></span></p>
          <p>총금액 : <span id="confirmTotalPrice"></span></p>
        </div>
        <a href="order-list.html">내 주문목록에서 확인하기</a>
      </li>
    </main>

    <footer>
      <p>&copy; 2026 내 쇼핑몰.</p>
    </footer>

    <script src="order.js"></script>
  </body>
</html>
